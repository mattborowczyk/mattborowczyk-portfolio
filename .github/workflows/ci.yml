name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # No secrets needed: with no Sanity env the site builds from the local
      # seed in lib/*, which is the same fallback that keeps production up if
      # the CMS is unreachable. Worth having CI exercise that path.
      - name: Build
        run: pnpm build
